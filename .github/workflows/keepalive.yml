name: Keep Render awake

on:
  schedule:
    # Render free duerme tras 15 minutos sin tráfico.
    # GitHub puede demorar los cron, por eso pingueamos cada 5 minutos.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health endpoint
        run: |
          curl --fail --silent --show-error \
            --max-time 90 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            https://appbets.onrender.com/health
