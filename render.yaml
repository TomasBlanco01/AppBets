services:
  - type: web
    name: appbets
    runtime: node
    plan: free
    buildCommand: cd Frontend && npm install && npm run build && cd ../Backend && npm install
    startCommand: node Backend/index.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
